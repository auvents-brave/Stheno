name: Android
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Swift package on Android
        uses: skiptools/swift-android-action@v2
        with:
          swift-version: "6.4.1"
          run-tests: true
          # The action only packs `*.resources` into the emulator, the name
          # SwiftPM gave resource bundles under the old build layout.  Swift
          # 6.4 builds into `.build/out/Products`, where they are `*.bundle`,
          # so the glob matched nothing and `Bundle.module` trapped with
          # "unable to find bundle named Stheno_SthenoTests".  Copy them
          # across ourselves; the arch is left loose for aarch64 runners.
          copy-files: .build/out/Products/Debug-android-*/*.bundle
